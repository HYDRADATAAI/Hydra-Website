name: Public surface validation

on:
  pull_request:
    paths:
      - "**/*.html"
      - "**/*.md"
      - "**/*.css"
      - "**/*.js"
      - "evidence/**"
      - "tools/validate_public_surface.py"
      - ".github/workflows/public-surface-validation.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "**/*.md"
      - "**/*.css"
      - "**/*.js"
      - "evidence/**"
      - "tools/validate_public_surface.py"
      - ".github/workflows/public-surface-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate recruiter-facing public surface
        run: python tools/validate_public_surface.py
